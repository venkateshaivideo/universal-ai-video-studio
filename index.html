<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal AI Video Studio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      color: #cbd5e1;
    }

    .card {
      margin-top: 40px;
      padding: 30px;
      background: #1e293b;
      border-radius: 16px;
    }

    button {
      margin-top: 20px;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎬 Universal AI Video Studio</h1>

    <p>
      Create videos with AI — simple, powerful and free-first.
    </p>

    <div class="card">
      <h2>AI Video Studio</h2>
      <p>
        Your universal AI-powered video creation platform.
      </p>

      <button onclick="startStudio()">
        Start Creating
      </button>
    </div>
  </div>

  <script>
    function startStudio() {
      alert("Universal AI Video Studio is starting!");
    }
  </script>
</body>
</html>
